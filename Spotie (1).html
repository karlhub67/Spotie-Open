<style>

#col{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}main{flex:1;min-height:0}

</style></head><body>

mvup(){mv(+el.dataset.i,-1)},mvdn(){mv(+el.dataset.i,1)},rmpl(){const p=S.pl.find(x=>x.id===S.plid);p.ids=p.ids.filter(x=>x!==id);save();render()},
qclear(){S.qs='';render();$('#gq').focus()},rq(){S.qs=el.dataset.q;render()},rqclear(){S.rq=[];save();render()},hclear(){S.hist=[];save();render();toast('History cleared')},
wipe(){modal(`<h2 style="margin-top:0">Delete all data?</h2><p class="sub">This removes your library files, playlists, favorites, history and themes from this browser.</p><button class="btn" data-act="wipe2">Delete everything</button> <button class="btn ghost" data-act="mclose">Cancel</button>`)},wipe2(){A.pause();T=[];TM={};Q=[];qi=-1;try{db.transaction('t','readwrite').objectStore('t').clear()}catch{}S={...S,theme:DEF(),themes:[],pl:[],fav:[],hist:[],rq:[],set:{off:0,shuf:0,rep:'off',vol:.8,hOn:1,auto:1,fs:15,cmp:0,rm:0}};W=null;save();modal();ui();render()},
set(){S.set[el.dataset.k]=+!S.set[el.dataset.k];save();apply(W||S.theme);render();if(el.dataset.k==='off')toast(S.set.off?'Offline mode on':'Offline mode off')},
preset(){W={...mk(P[+el.dataset.i],+el.dataset.i==0?'#D85D91':0)};apply(W);render()},mode(){W=el.dataset.m=='dark'?{...W,...DARK,name:W.name}:{...W,...mk(P[0],'#D85D91'),accent:W.accent,accent2:W.accent2,btn:W.btn,prog:W.prog,navOn:W.navOn,icon:W.icon,g2:W.g2,name:W.name};apply(W);render()},
tsave(){const n=$('#tn').value.trim()||'My theme';W.name=n;const i=S.themes.findIndex(t=>t.name===n);i<0?S.themes.push({...W}):S.themes[i]={...W};S.theme={...W};save();render();toast('Theme saved')},tcancel(){W={...S.theme};apply(S.theme);render()},treset(){W=DEF();apply(W);render()},tuse(){W={...S.themes[+el.dataset.i]};S.theme={...W};save();render()},tdel(){S.themes.splice(+el.dataset.i,1);save();render()}};
(act[a]||(()=>{}))();if(a==='mclose')modal()});
function mv(i,d){const p=S.pl.find(x=>x.id===S.plid),j=i+d;if(j<0||j>=p.ids.length)return;[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];save();render()}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='gq'){const was=!!S.qs.trim();S.qs=t.value;$('#sb').classList.toggle('has',!!t.value);const now=!!S.qs.trim();if(was!==now)render();else if(now){const r=$('#res');r.classList.remove('fresh');r.innerHTML=sres();$('#qs').textContent='for "'+S.qs+'"'}}else if(t.id==='sk'||t.id==='sk2'){if(A.duration)A.currentTime=t.value/1000*A.duration}else if(t.id==='vol'){A.volume=S.set.vol=t.value/100;save()}else if(t.dataset.k){W[t.dataset.k]=t.value;apply(W);const x=document.querySelector(`[data-kt=${t.dataset.k}]`);if(x)x.value=t.value}else if(t.dataset.kt&&/^#[0-9a-f]{6}$/i.test(t.value)){W[t.dataset.kt]=t.value;apply(W);document.querySelector(`[data-k=${t.dataset.kt}]`).value=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='sort'){sortBy=t.value;render()}else if('fs'in t.dataset){S.set.fs=+t.value;save();apply(W||S.theme)}else if('rep'in t.dataset){S.set.rep=t.value;save();ui()}else if('sleep'in t.dataset){clearTimeout(window.sl);sleepT=+t.value;if(sleepT){window.sl=setTimeout(()=>{A.pause();sleepT=0;ui();toast('Sleep timer ended')},sleepT*60000);toast('Sleep timer set. It may not fire if the browser suspends this tab.')}}});
document.addEventListener('keydown',e=>{const tg=e.target.tagName,inp=tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA';if(e.key==='Escape'){if($('#pm').classList.contains('open')){closePm();$('#pb').focus()}else if($('#modal').innerHTML)modal();else $('#sheet').classList.remove('open')}else if(e.key==='Enter'&&e.target.id==='gq'){const q=S.qs.trim();if(q&&!S.rq.includes(q)){S.rq=[q,...S.rq].slice(0,8);save()}}else if(e.key==='Enter'&&e.target.id==='nm'){document.querySelector('#modal .btn').click()}else if(e.key==='Enter'&&e.target.matches('.row,.card,#pi')){e.target.click()}else if(!inp&&e.key===' '&&cur()){e.preventDefault();A.paused?A.play():A.pause()}else if(!inp&&e.key==='ArrowRight')A.currentTime+=5;else if(!inp&&e.key==='ArrowLeft')A.currentTime-=5;else if(!inp&&e.key==='/'){e.preventDefault();$('#gq').focus()}});
